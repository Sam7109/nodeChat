<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="bg-gray-100">
    <div class="flex flex-col h-screen">

        <!-- Header -->
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold">Chat Application</h1>
            <button id="logoutButton" class="bg-red-500 text-white rounded px-4 py-2 hover:bg-red-600">
                Logout
            </button>
        </header>

        <div class="flex flex-1">

            <!-- Sidebar for Contacts -->
            <aside class="bg-white w-1/4 p-4 border-r border-gray-300">
                <h2 class="text-lg font-semibold mb-4">Contacts</h2>
                <ul>
                    <li class="mb-2">
                        <a href="#" class="block p-2 rounded hover:bg-blue-100">Alice</a>
                    </li>
                    <li class="mb-2">
                        <a href="#" class="block p-2 rounded hover:bg-blue-100">Bob</a>
                    </li>
                    <li class="mb-2">
                        <a href="#" class="block p-2 rounded hover:bg-blue-100">Charlie</a>
                    </li>
                    <li class="mb-2">
                        <a href="#" class="block p-2 rounded hover:bg-blue-100">David</a>
                    </li>
                    <li class="mb-2">
                        <a href="#" class="block p-2 rounded hover:bg-blue-100">Eve</a>
                    </li>
                </ul>

                <h2 class="text-lg font-semibold mt-6 mb-4">Groups</h2>
                <ul id="groupList" class="mb-4">
                    <!-- Groups will be dynamically populated here -->
                </ul>
                <button id="createGroupButton"
                    class="bg-blue-500 text-white rounded px-4 py-2 hover:bg-blue-600 w-full">
                    Create Group
                </button>
            </aside>

            <!-- Main Chat Area -->
            <main class="flex-1 p-4">
                <div class="bg-white rounded-lg shadow-lg h-full flex flex-col">
                    <div id="chatArea" class="flex-1 p-4 border-b border-gray-300 overflow-y-auto h-64">
                        <!-- Messages will appear here dynamically -->
                    </div>
                    <div class="p-4 border-t border-gray-300 flex items-center">
                        <input type="text" id="messageInput" placeholder="Type a message..."
                            class="border rounded w-full p-2 mr-2">
                        <button id="sendMessageButton"
                            class="bg-blue-500 text-white rounded-full p-3 hover:bg-blue-600 flex items-center">
                            <i class="fas fa-paper-plane mr-2"></i>
                            <span>Send</span>
                        </button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal for Create Group -->
    <div id="createGroupModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center hidden">
        <div class="bg-white rounded-lg shadow-lg p-6 w-1/3">
            <h2 class="text-xl font-semibold mb-4">Create Group</h2>
            <input type="text" id="groupNameInput" placeholder="Group Name" class="border rounded w-full p-2 mb-4">
            <h3 class="text-lg font-semibold mb-2">Add Members:</h3>
            <div id="contactsList" class="flex flex-wrap mb-4">
                <!-- Dynamic list of contacts with checkboxes -->
            </div>
            <div class="flex justify-end">
                <button id="cancelGroupButton"
                    class="bg-gray-300 text-gray-700 rounded px-4 py-2 mr-2 hover:bg-gray-400">
                    Cancel
                </button>
                <button id="createGroupSubmit" class="bg-blue-500 text-white rounded px-4 py-2 hover:bg-blue-600">
                    Create Group
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const messageInput = document.getElementById('messageInput');
        const groupList = document.getElementById('groupList');
        const createGroupButton = document.getElementById('createGroupButton');
        const createGroupModal = document.getElementById('createGroupModal');
        const groupNameInput = document.getElementById('groupNameInput');
        const contactsList = document.getElementById('contactsList');

        // Fetch messages when the page loads
        window.onload = fetchMessages;

        // Fetch and display messages
        // function fetchMessages() {
        //     const token = localStorage.getItem('jwt');
        //     if (!token) {
        //         alert("You need to log in to view the messages.");
        //         return;
        //     }
        //     axios.get("/textroutes/getMessages", {
        //         headers: { 'Authorization': `Bearer ${token}` }
        //     }).then(response => {
        //         chatArea.innerHTML = "";
        //         response.data.messages.forEach(msg => {
        //             const messageElement = document.createElement('div');
        //             messageElement.textContent = `${msg.user}: ${msg.message}`;
        //             chatArea.appendChild(messageElement);
        //         });
        //     }).catch(console.error);
        // }
        function fetchMessages() {
            const token = localStorage.getItem('jwt');
            if (!token) {
                alert("You need to log in to view the messages.");
                return;
            }

            axios.get("/textroutes/getMessages", {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(response => {
                console.log(response)
                chatArea.innerHTML = ""; // Clear chat area before displaying new messages

                response.data.forEach(msg => {
                    // Create a container for the entire message
                    const messageContainer = document.createElement('div');
                    messageContainer.className = 'mb-2'; // Add some spacing between messages

                    // Create a sender and message element
                    const messageTextElement = document.createElement('span');
                    messageTextElement.textContent = `${msg.sender}: ${msg.message}`;
                    messageTextElement.className = 'font-bold text-blue-700'; // Optional styling for sender/message

                    // Create a timestamp element
                    const timestampElement = document.createElement('span');
                    const timestamp = new Date(msg.timestamp).toLocaleString();
                    timestampElement.textContent = ` - ${timestamp}`;
                    timestampElement.className = 'text-sm text-gray-500'; // Optional styling for timestamp

                    // Append the message text and timestamp to the container
                    messageContainer.appendChild(messageTextElement);
                    messageContainer.appendChild(timestampElement);

                    // Append the message container to the chat area
                    chatArea.appendChild(messageContainer);
                });


            }).catch(error => {
                console.error("Error fetching messages:", error);
            });
        }


        // Open the create group modal
        createGroupButton.addEventListener("click", () => {
            contactsList.innerHTML = "";
            ["Alice", "Bob", "Charlie", "David", "Eve"].forEach(contact => {
                const contactElement = document.createElement("div");
                contactElement.innerHTML = `<input type="checkbox" value="${contact}">${contact}`;
                contactsList.appendChild(contactElement);
            });
            createGroupModal.classList.remove("hidden");
        });

        // Close modal
        document.getElementById("cancelGroupButton").addEventListener("click", () => {
            createGroupModal.classList.add("hidden");
        });

        // Create group
        document.getElementById("createGroupSubmit").addEventListener("click", () => {
            const groupName = groupNameInput.value.trim();
            const members = Array.from(contactsList.querySelectorAll("input:checked")).map(input => input.value);

            if (!groupName || !members.length) {
                alert("Group name and members are required.");
                return;
            }

            const token = localStorage.getItem('jwt');
            axios.post("/groupRoutes/create", { groupName, members }, {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(response => {
                const group = document.createElement("li");
                group.innerHTML = `<a href="#">${groupName}</a>`;
                groupList.appendChild(group);
                createGroupModal.classList.add("hidden");
                groupNameInput.value = "";
            }).catch(console.error);
        });

        // Logout functionality
        document.getElementById("logoutButton").addEventListener("click", () => {
            localStorage.removeItem("jwt");
            window.location.href = "/login.html";
        });

        // Send message functionality
        document.getElementById("sendMessageButton").addEventListener("click", () => {
            const message = messageInput.value.trim();
            if (!message) return;
            const token = localStorage.getItem('jwt');
            axios.post("/textroutes/send", { message }, {
                headers: { 'Authorization': `Bearer ${token}` }
            }).then(() => {
                const messageElement = document.createElement('div');
                messageElement.textContent = `You: ${message}`;
                chatArea.appendChild(messageElement);
                messageInput.value = "";
            }).catch(console.error);
        });
    </script>
</body>

</html>
